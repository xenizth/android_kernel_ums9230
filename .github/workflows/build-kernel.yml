name: Build Custom Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ github.ref_name }}
          max-size: 2G

      - name: Build Image
        env:
          CCACHE_SLOPPINESS: time_macros,include_file_mtime
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_COMPILERCHECK: "string:proton-clang-12"
        run: |
          # Use the toolchain bundled in the repo (../toolchain relative to out/)
          # so clang, llvm-nm, ld.lld etc. are all the same version.
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          clang --version | head -n 1
          llvm-nm --version | head -n 2
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" O="out" unisoc_defconfig
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" O="out" -j$(nproc) Image

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Compress Image with xz -9e
        run: |
          xz -9e -k -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image.xz
          if-no-files-found: warn
