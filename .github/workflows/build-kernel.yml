name: Build Custom Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: "KernelSU-Next tag/branch to use (e.g. v3.4.1, dev, stable). Type 'none' to skip and keep the KernelSU already in the repo"
        required: false
        default: "v3.4.1"
        type: string
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Done at build time only: nothing is committed or pushed to the repo.
      - name: Update KernelSU-Next
        if: ${{ inputs.ksu_version != 'none' }}
        shell: bash
        env:
          # Push-triggered runs have no inputs, so they fall back to v3.4.1.
          KSU_VERSION: ${{ inputs.ksu_version || 'v3.4.1' }}
        run: |
          rm -rf drivers/kernelsu KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_VERSION"
          ls -la drivers/kernelsu
          git -C KernelSU-Next describe --tags --always

          # setup.sh silently stays on the default branch if the tag doesn't exist,
          # so fail here instead of building the wrong version.
          if [[ "$KSU_VERSION" =~ ^v[0-9] ]]; then
            got="$(git -C KernelSU-Next describe --tags --exact-match 2>/dev/null || true)"
            if [ "$got" != "$KSU_VERSION" ]; then
              echo "::error::Requested KernelSU-Next '$KSU_VERSION' but checkout is at '${got:-$(git -C KernelSU-Next describe --tags --always)}'"
              exit 1
            fi
          fi

          # 5.4 compat: <linux/pgtable.h> only exists on kernels >= 5.8
          # (on older kernels the header is <asm/pgtable.h>).
          grep -rl '<linux/pgtable.h>' KernelSU-Next/kernel | while read -r f; do
            sed -i 's|#include <linux/pgtable.h>|#include <linux/version.h>\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 8, 0)\n#include <linux/pgtable.h>\n#else\n#include <asm/pgtable.h>\n#endif|' "$f"
            echo "patched pgtable include in $f"
          done

          # 5.4 compat: copy_to/from_kernel_nofault were added in 5.8
          # (on older kernels they are probe_kernel_write / probe_kernel_read).
          grep -rlE 'copy_(to|from)_kernel_nofault' KernelSU-Next/kernel | while read -r f; do
            sed -i '1i #include <linux/version.h>\n#include <linux/uaccess.h>\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)\n#define copy_to_kernel_nofault(dst, src, size) probe_kernel_write(dst, src, size)\n#define copy_from_kernel_nofault(dst, src, size) probe_kernel_read(dst, src, size)\n#endif' "$f"
            echo "added nofault compat to $f"
          done

          # 5.4 compat for manager/pkg_observer.c:
          #  - TWA_RESUME (task_work_add notify mode enum) appeared in 5.7; before that
          #    task_work_add() takes a bool.
          #  - fsnotify_ops.handle_inode_event appeared in 5.9; before that the only
          #    callback is handle_event() with a different signature.
          python3 - <<'PY'
          import sys
          p = "KernelSU-Next/kernel/manager/pkg_observer.c"
          try:
              s = open(p).read()
          except FileNotFoundError:
              print("pkg_observer.c not found, skipping")
              sys.exit(0)
          if "KSU_COMPAT_FSNOTIFY" in s:
              sys.exit(0)

          head = (
              "/* KSU_COMPAT_FSNOTIFY: 5.4 compat shims */\n"
              "#include <linux/version.h>\n"
              "#include <linux/task_work.h>\n"
              "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 7, 0)\n"
              "#define TWA_RESUME true\n"
              "#endif\n"
          )

          old = ".handle_inode_event = ksu_handle_inode_event,"
          marker = "static const struct fsnotify_ops ksu_ops = {"
          if old not in s or marker not in s:
              print("::error::pkg_observer.c layout changed, compat patch not applied")
              sys.exit(1)

          wrapper = (
              "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)\n"
              "static int ksu_handle_event_compat(struct fsnotify_group *group,\n"
              "                                   struct inode *inode, u32 mask,\n"
              "                                   const void *data, int data_type,\n"
              "                                   const struct qstr *file_name, u32 cookie,\n"
              "                                   struct fsnotify_iter_info *iter_info)\n"
              "{\n"
              "    return ksu_handle_inode_event(NULL, mask, inode, NULL, file_name, cookie);\n"
              "}\n"
              "#define KSU_FSNOTIFY_HANDLER .handle_event = ksu_handle_event_compat,\n"
              "#else\n"
              "#define KSU_FSNOTIFY_HANDLER .handle_inode_event = ksu_handle_inode_event,\n"
              "#endif\n\n"
          )

          # replace the initializer first, then add the wrapper (which itself
          # contains the old text) so we never rewrite our own #define
          s = head + s
          s = s.replace(old, "KSU_FSNOTIFY_HANDLER", 1)
          s = s.replace(marker, wrapper + marker, 1)
          open(p, "w").write(s)
          print("patched", p)
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ github.ref_name }}
          max-size: 2G

      - name: Build Image
        env:
          CCACHE_SLOPPINESS: time_macros,include_file_mtime
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_COMPILERCHECK: "string:proton-clang-12"
        run: |
          # Use the toolchain bundled in the repo (../toolchain relative to out/)
          # so clang, llvm-nm, ld.lld etc. are all the same version.
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          clang --version | head -n 1
          llvm-nm --version | head -n 2
          # Kernel itself: bundled Proton clang 12 (first on PATH).
          # Host tools (fixdep etc.): runner's clang + system linker, because
          # Proton's old bundled ld can't read Ubuntu 24.04's glibc (.relr.dyn).
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC=/usr/bin/clang HOSTCXX=/usr/bin/clang++ O="out" unisoc_defconfig
          make LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC=/usr/bin/clang HOSTCXX=/usr/bin/clang++ O="out" -j$(nproc) Image

      # Shows which KSU/SUSFS options survived in the final config.
      - name: Show KernelSU config
        if: always()
        run: |
          echo "== KernelSU-Next source =="
          git -C KernelSU-Next describe --tags --always || true
          git -C KernelSU-Next log -1 --format='%h %s (%cd)' || true
          git -C KernelSU-Next remote get-url origin || true
          echo "== CONFIG_KSU* in final config =="
          grep -E "CONFIG_KSU" out/.config || echo "No CONFIG_KSU* options in out/.config"

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Compress Image with xz -9e
        run: |
          xz -9e -k -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image.xz
          if-no-files-found: warn
